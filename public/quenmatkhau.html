<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c1a17">
<title>Quên mật khẩu — LỤA</title>
<meta name="robots" content="noindex">
<meta name="description" content="Đặt lại mật khẩu tài khoản LỤA.">
<meta property="og:site_name" content="LỤA">
<meta property="og:locale" content="vi_VN">
<meta property="og:type" content="website">
<meta property="og:title" content="Quên mật khẩu — LỤA">
<meta property="og:description" content="Đặt lại mật khẩu tài khoản LỤA.">
<meta property="og:url" content="%ORIGIN%/quenmatkhau.html">
<meta property="og:image" content="%ORIGIN%/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main">
  <section class="auth-section">
    <div class="wrap auth-layout">
      <div class="auth-intro">
        <span class="hero-eyebrow">Tài khoản LỤA</span>
        <h1>Quên mật khẩu</h1>
        <p class="muted">Nhập email đã đăng ký, chúng tôi sẽ gửi mã 6 số để bạn đặt mật khẩu mới. Mã có hiệu lực trong 15 phút.</p>
      </div>

      <div class="auth-card">
        <form id="forgotForm" novalidate>
          <p class="form-note" role="alert" hidden></p>
          <div class="form-field">
            <label for="fpEmail">Email</label>
            <input type="email" id="fpEmail" name="email" autocomplete="username" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Gửi mã</button>
        </form>

        <form id="resetForm" novalidate hidden>
          <p class="form-note" role="alert" hidden></p>
          <p class="muted small" id="sentTo"></p>
          <div class="form-field">
            <label for="fpCode">Mã 6 số trong email</label>
            <input id="fpCode" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
          </div>
          <div class="form-field">
            <label for="fpPassword">Mật khẩu mới</label>
            <input type="password" id="fpPassword" name="password" autocomplete="new-password" required>
            <p class="muted small">Ít nhất 8 ký tự, gồm cả chữ và số.</p>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Đặt lại mật khẩu</button>
          <p class="small"><button type="button" class="link-btn" id="resend">Gửi lại mã</button></p>
        </form>
        <p class="small"><a href="dangnhap.html" class="text-link">← Quay lại đăng nhập</a></p>
      </div>
    </div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script src="js/forgot.js"></script>
</body>
</html>
